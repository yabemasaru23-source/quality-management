<svg width="100%" viewBox="0 0 720 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>磨かれた革靴——感動エッセイ</title>
<desc>磨かれて光る一足の革靴のイラストと記事タイトルを配したサムネイル</desc>
<rect width="720" height="380" fill="#0a2a5e"/>
<circle cx="650" cy="30" r="150" fill="#1f5cb0" opacity=".30"/>
<circle cx="50" cy="370" r="120" fill="#1f5cb0" opacity=".22"/>

<!-- テキスト -->
<text x="360" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffe14d" letter-spacing="4">感動エッセイ</text>
<text x="360" y="118" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="900" fill="#ffffff">磨かれた革靴</text>
<text x="360" y="152" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#cfe0f5">半年契約ゼロの営業マンが、契約より先に見つけたもの</text>

<!-- 床 -->
<rect x="180" y="296" width="360" height="6" rx="3" fill="#4a76b8" opacity=".55"/>

<!-- 革靴（横向き・シンプル形状） -->
<g>
  <!-- 本体 -->
  <path d="M245 296
           L245 246
           Q245 216 275 212
           Q300 209 312 226
           Q322 240 344 250
           Q378 265 430 270
           Q470 274 475 288
           L475 296 Z" fill="#123a75" stroke="#3a6cb0" stroke-width="3"/>
  <!-- ソール -->
  <rect x="238" y="296" width="245" height="12" rx="6" fill="#081d3f"/>
  <!-- 履き口の影 -->
  <path d="M258 240 Q272 226 292 224 Q286 240 284 252 Q268 248 258 240 Z" fill="#081d3f"/>
  <!-- 靴ひも -->
  <g stroke="#9fc0e8" stroke-width="4" stroke-linecap="round">
    <line x1="306" y1="234" x2="332" y2="244"/>
    <line x1="311" y1="248" x2="337" y2="257"/>
  </g>
  <!-- つま先ハイライト（磨きの光） -->
  <path d="M420 272 Q452 276 468 286 Q450 274 424 270 Z" fill="#dcebff" opacity=".95"/>
  <path d="M282 216 Q300 212 310 222 Q296 216 284 220 Z" fill="#9fc0e8" opacity=".8"/>
</g>

<!-- 輝きの星 -->
<g fill="#ffe14d">
  <path d="M492 246 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z"/>
  <path d="M222 252 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
  <path d="M392 200 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5 Z"/>
</g>

<text x="360" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#8fb0d8" letter-spacing="2">株式会社クオリティマネジメント｜感動創造部</text>
</svg>
